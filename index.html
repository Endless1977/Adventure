<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one cabinet column — screen on top, beveled 90s verb/inventory panel below. Single committed dark look. */
:root{
  --bg:#0a0912; --cab:#16131f; --bevel-hi:#3d3552; --bevel-lo:#07060b;
  --ink:#d9d2f2; --dim:#8d84a8; --amber:#ffb43a; --phos:#7dffa8; --alarm:#ff5a6a;
  --f-ui:"Silkscreen","Courier New",monospace; --f-talk:"VT323","Courier New",monospace;
  color-scheme:dark; --u:1px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:1152px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.06em;min-width:0}
#obj{color:var(--amber);flex:1 1 280px;min-width:0;line-height:1.4}
#obj b{color:var(--dim);font-weight:400;margin-right:6px}
.meters{display:flex;gap:14px;align-items:center}
.meter{display:flex;align-items:center;gap:6px;color:var(--dim)}
.bar{width:84px;height:9px;background:#05040a;box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--phos);transition:width .3s}
.bar .thr{position:absolute;top:0;bottom:0;width:1px;background:var(--alarm)}
#traceBar i{background:var(--amber)}
#traceBar.hot i{background:var(--alarm);animation:pulse .4s infinite alternate}
@keyframes pulse{to{opacity:.4}}
.mbtn{font:inherit;font-size:11px;background:var(--cab);color:var(--ink);border:0;padding:5px 9px;cursor:pointer;box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo)}
.mbtn:hover{color:var(--amber)}
.mbtn:focus-visible,.verb:focus-visible,.slot:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;box-shadow:0 0 0 3px var(--cab),0 0 0 4px var(--bevel-hi);overflow:hidden;touch-action:manipulation}
#scr{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
#talk{position:absolute;pointer-events:none;font-family:var(--f-talk);font-size:max(15px,calc(var(--u)*10));line-height:1.02;text-align:center;max-width:62%;transform:translate(-50%,-100%);text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000;white-space:pre-line}
#note{position:absolute;left:50%;top:6%;transform:translateX(-50%);pointer-events:none;font-family:var(--f-talk);font-size:max(14px,calc(var(--u)*8));color:var(--amber);text-shadow:2px 2px #000;opacity:0;transition:opacity .3s}
#ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7%;gap:10px;pointer-events:none}
#ovl .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
#ovl .big{font:inherit;font-size:max(11px,calc(var(--u)*6));background:#120f1c;color:var(--amber);border:0;padding:.7em 1.3em;cursor:pointer;box-shadow:inset 2px 2px 0 var(--bevel-hi),inset -2px -2px 0 var(--bevel-lo),0 0 0 2px #000}
#ovl .big:hover{background:#221b33}
#story{position:absolute;inset:8% 12%;display:flex;flex-direction:column;justify-content:center;gap:.5em;font-family:var(--f-talk);font-size:max(15px,calc(var(--u)*9.5));line-height:1.15;color:#fff4dc;text-shadow:2px 2px #000;text-align:center;pointer-events:none}
#story p{margin:0;opacity:0;transition:opacity 1.2s}
#story p.on{opacity:1}
#sentence{min-height:1.4em;font-size:12px;color:var(--phos);letter-spacing:.05em;padding:2px 2px}
#panel{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:10px;background:var(--cab);padding:10px;box-shadow:inset 2px 2px 0 var(--bevel-hi),inset -2px -2px 0 var(--bevel-lo)}
#verbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.verb{font:inherit;font-size:clamp(10px,1.3vw,13px);background:#0f0d17;color:#9b92bb;border:0;padding:9px 2px;cursor:pointer;box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
.verb:hover{color:var(--ink)}
.verb.on{color:var(--amber);background:#1d1828}
#inv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;align-content:start}
.slot{aspect-ratio:4/3;background:#0b0a12;border:0;padding:0;box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi);cursor:pointer;display:flex;align-items:center;justify-content:center}
.slot canvas{width:100%;height:100%;image-rendering:pixelated}
.slot.sel{box-shadow:0 0 0 2px var(--amber)}
#dlg{grid-column:1/-1;display:flex;flex-direction:column;gap:2px}
.opt{font-family:var(--f-talk);font-size:max(16px,1.7vw);text-align:left;background:none;border:0;color:#a69ccc;padding:3px 6px;cursor:pointer;line-height:1.1}
.opt:hover{color:var(--phos);background:#0f0d17}
#foot{font-size:10px;color:#5d5675;text-align:center;letter-spacing:.06em;line-height:1.6}
@media (max-width:640px){
  #panel{grid-template-columns:1fr}
  #inv{grid-template-columns:repeat(6,minmax(0,1fr))}
  .bar{width:60px}
  #talk{max-width:90%;font-size:15px}
  .mbtn{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){#traceBar.hot i{animation:none}}

<script>
'use strict';
/* ================= CORE: pixel primitives ================= */
const W=384,H=216;
let G=null;
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const HXC={};
function hx(c){if(HXC[c])return HXC[c];let s=c.replace('#','');if(s.length===3)s=s.split('').map(x=>x+x).join('');const a=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];HXC[c]=a;return a;}
function mix(a,b,t){const A=hx(a),B=hx(b);return '#'+[0,1,2].map(i=>Math.max(0,Math.min(255,Math.round(A[i]+(B[i]-A[i])*t))).toString(16).padStart(2,'0')).join('');}
function rgba(c,a){const A=hx(c);return `rgba(${A[0]},${A[1]},${A[2]},${a})`;}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bay=(x,y)=>BAY[((y&3)<<2)|(x&3)];
function R(x,y,w,h,c){if(w<=0||h<=0)return;G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function P(x,y,c){G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),1,1);}
function L(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);G.fillStyle=c;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;for(;;){G.fillRect(x0,y0,1,1);if((x0===x1&&y0===y1)||n++>3000)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function TL(x0,y0,x1,y1,c,th){for(let i=0;i<th;i++)L(x0,y0+i,x1,y1+i,c);}
function poly(pts,c){G.fillStyle=c;let mn=1e9,mx=-1e9;for(const p of pts){if(p[1]<mn)mn=p[1];if(p[1]>mx)mx=p[1];}const n=pts.length;for(let y=Math.floor(mn);y<=Math.ceil(mx);y++){const yc=y+.5,xs=[];for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}xs.sort((p,q)=>p-q);for(let i=0;i+1<xs.length;i+=2){const x0=Math.round(xs[i]),x1=Math.round(xs[i+1]);if(x1>x0)G.fillRect(x0,y,x1-x0,1);}}}
function disc(cx,cy,r,c){G.fillStyle=c;const n=Math.ceil(r);for(let dy=-n;dy<=n;dy++){const q=r*r-dy*dy;if(q<0)continue;const w=Math.sqrt(q);const x0=Math.round(cx-w),x1=Math.round(cx+w);if(x1>x0)G.fillRect(x0,Math.round(cy+dy),x1-x0,1);}}
function ell(cx,cy,rx,ry,c){if(rx<=0||ry<=0)return;G.fillStyle=c;const n=Math.ceil(ry);for(let dy=-n;dy<=n;dy++){const q=1-(dy*dy)/(ry*ry);if(q<0)continue;const w=rx*Math.sqrt(q);const x0=Math.round(cx-w),x1=Math.round(cx+w);if(x1>x0)G.fillRect(x0,Math.round(cy+dy),x1-x0,1);}}
function ring(cx,cy,r,th,c){G.fillStyle=c;const ri=r-th,n=Math.ceil(r);for(let dy=-n;dy<=n;dy++){const q=r*r-dy*dy;if(q<0)continue;const w=Math.sqrt(q),qi=ri*ri-dy*dy,wi=qi>0?Math.sqrt(qi):0,y=Math.round(cy+dy);if(wi>0){const a0=Math.round(cx-w),a1=Math.round(cx-wi),b0=Math.round(cx+wi),b1=Math.round(cx+w);if(a1>a0)G.fillRect(a0,y,a1-a0,1);if(b1>b0)G.fillRect(b0,y,b1-b0,1);}else{const x0=Math.round(cx-w),x1=Math.round(cx+w);if(x1>x0)G.fillRect(x0,y,x1-x0,1);}}}
function dith(x,y,w,h,c,d){G.fillStyle=c;x=Math.round(x);y=Math.round(y);for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(bay(x+i,y+j)<d)G.fillRect(x+i,y+j,1,1);}
function shade(x,y,w,h,c,a){G.fillStyle=rgba(c,a);G.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function stopAt(st,t){for(let i=0;i<st.length-1;i++){const a=st[i],b=st[i+1];if(t<=b[0]){const f=(t-a[0])/((b[0]-a[0])||1);const A=hx(a[1]),B=hx(b[1]);return[A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f];}}return hx(st[st.length-1][1]);}
function vgrad(x,y,w,h,st,lv=12){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);if(w<=0||h<=0)return;const cs=[];for(let i=0;i<=lv;i++)cs.push(stopAt(st,i/lv));const im=G.getImageData(x,y,w,h),d=im.data;for(let j=0;j<h;j++){const v=j/Math.max(1,h-1)*lv,i0=Math.floor(v),f=v-i0;for(let i=0;i<w;i++){const c=cs[Math.min(lv,f>bay(x+i,y+j)?i0+1:i0)];const k=(j*w+i)<<2;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;}}G.putImageData(im,x,y);}
function dglow(cx,cy,r,c,mx=.6){G.fillStyle=c;const n=Math.ceil(r);for(let y=-n;y<=n;y++)for(let x=-n;x<=n;x++){const d=Math.sqrt(x*x+y*y)/r;if(d>=1)continue;if(bay(Math.round(cx+x),Math.round(cy+y))<(1-d)*(1-d)*mx)G.fillRect(Math.round(cx+x),Math.round(cy+y),1,1);}}
function sglow(x,y,r,c,a=.5){const A=hx(c);const gr=G.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${A[0]},${A[1]},${A[2]},${a})`);gr.addColorStop(1,`rgba(${A[0]},${A[1]},${A[2]},0)`);G.save();G.globalCompositeOperation='lighter';G.fillStyle=gr;G.fillRect(x-r,y-r,2*r,2*r);G.restore();}

/* 3x5 pixel font */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',' ':'000000000000000','!':'010010010000010','.':'000000000000010','-':'000000111000000',':':'000010000010000','?':'110001010000010','/':'001001010100100','#':'101111101111101','%':'101001010100101','>':'100010001010100','<':'001010100010001','+':'000010111010000',"'":'010010000000000',',':'000000000010100','&':'010101010101011','=':'000111000111000','*':'101010101000000','(':'010100100100010',')':'010001001001010','@':'010101111100011','$':'011110010011110','_':'000000000000111'};
function ptext(s,x,y,c,sc=1){s=String(s).toUpperCase();G.fillStyle=c;let cx=Math.round(x);for(const ch of s){const f=FONT[ch]||FONT['?'];for(let i=0;i<15;i++)if(f[i]==='1')G.fillRect(cx+(i%3)*sc,Math.round(y)+((i/3)|0)*sc,sc,sc);cx+=4*sc;}}
const ptw=(s,sc=1)=>String(s).length*4*sc-sc;
function ptextc(s,cx,y,c,sc=1,sh){const x=cx-ptw(s,sc)/2;if(sh)ptext(s,x+sc,y+sc,sh,sc);ptext(s,x,y,c,sc);}

/* ================= ART LIBRARY ================= */
function stars(seed,n,y1,cols=['#ffffff','#b8c8ff','#ffe8b0','#8890b8']){const r=rnd(seed);for(let i=0;i<n;i++){const x=r()*W,y=r()*y1,c=cols[r()*cols.length|0];P(x,y,c);if(r()<.05){P(x-1,y,rgba(c,.5));P(x+1,y,rgba(c,.5));P(x,y-1,rgba(c,.5));P(x,y+1,rgba(c,.5));}}}
function twinkle(seed,n,y1,t){const r=rnd(seed);for(let i=0;i<n;i++){const x=r()*W|0,y=r()*y1|0,ph=r()*6.28,sp=1+r()*2;const v=Math.sin(t*sp+ph);if(v>.6){P(x,y,'#fff');P(x-1,y,'#8aa');P(x+1,y,'#8aa');P(x,y-1,'#8aa');P(x,y+1,'#8aa');}}}
function moon(cx,cy,r,seed=7,c1='#ddd6ea',c2='#8a83a6',cr='#2a2238'){const q=rnd(seed);disc(cx,cy,r,c1);for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(x*x+y*y>r*r)continue;const s=(x+y*.8)/(r*1.5)+.2;if(bay(Math.round(cx+x),Math.round(cy+y))<s)P(cx+x,cy+y,c2);}
 for(let i=0;i<7;i++){const a=q()*6.28,d=q()*r*.72,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,k=1+q()*r*.16;disc(x,y,k,c2);P(x-k*.4,y-k*.5,c1);}
 let x=cx+r*.1,y=cy-r;for(let i=0;i<r*2.1;i++){P(x,y,cr);P(x+1,y,rgba(cr,.5));x+=(q()-.5)*1.8;y+=1;}
 for(let i=0;i<6;i++){const a=-1.1+q()*1.3,d=r*(1.2+q()*1.0),x2=cx+Math.cos(a)*d,y2=cy+Math.sin(a)*d,s=1+q()*r*.24;poly([[x2-s,y2],[x2,y2-s],[x2+s*.8,y2+s*.3],[x2,y2+s*.7]],c1);P(x2+s*.3,y2+s*.2,c2);}
 for(let i=0;i<90;i++){const a=q()*6.28,rx=r*2.2,ry=r*.42,x2=cx+Math.cos(a)*rx*(0.85+q()*.3),y2=cy+Math.sin(a)*ry*(0.85+q()*.3);if(Math.sin(a)<0&&(x2-cx)**2+(y2-cy)**2<r*r)continue;P(x2,y2,q()<.6?c1:c2);}}
function sun(cx,cy,r,c,halo){for(let k=3;k>=1;k--)dglow(cx,cy,r*(1+k*.9),halo,.5/k+.15);disc(cx,cy,r,c);}
function smog(y,h,c,d,seed){const q=rnd(seed),p1=q()*6,p2=q()*6;G.fillStyle=c;for(let x=0;x<W;x++){const off=Math.sin(x*.025+p1)*3+Math.sin(x*.07+p2)*1.5;for(let j=0;j<h;j++){const den=d*(1-Math.abs(2*j/h-1));const yy=Math.round(y+j+off);if(bay(x,yy)<den)G.fillRect(x,yy,1,1);}}}
function ridge(seed,y,amp,col,rough=0,f=1){const r=rnd(seed),ph=[r()*6,r()*6,r()*6],pts=[[-2,H+2]];for(let x=-2;x<=W+2;x+=2){pts.push([x,y+Math.sin(x*.013*f+ph[0])*amp+Math.sin(x*.041*f+ph[1])*amp*.45+Math.sin(x*.11*f+ph[2])*amp*.15+(rough?(r()-.5)*rough:0)]);}pts.push([W+2,H+2]);poly(pts,col);}
function skyline(seed,base,o){const r=rnd(seed);let x=o.x0??-6;while(x<(o.x1??W+6)){const w=o.minW+r()*(o.maxW-o.minW)|0,h=o.minH+r()*(o.maxH-o.minH)|0,top=base-h;let jag=false;
 if(o.broken&&r()<.55){jag=true;const pts=[[x,base],[x,top+(r()*8|0)]];let k=x;while(k<x+w){k+=2+(r()*4|0);pts.push([Math.min(k,x+w),top+(r()*14|0)]);}pts.push([x+w,base]);poly(pts,o.col);}else{R(x,top,w,h,o.col);if(o.cap&&r()<.4)R(x+2,top-3,w-4,3,o.col);}
 if(o.ant&&r()<.4){const ax=x+(r()*w|0);L(ax,top,ax,top-4-r()*12,o.col);if(o.antc)P(ax,top-5,o.antc);}
 if(o.win){const st=top+(jag?14:3);for(let wy=st;wy<base-2;wy+=o.wy||4)for(let wx=x+2;wx<x+w-2;wx+=o.wx||3)if(r()<o.rate)P(wx,wy,o.win2&&r()<.3?o.win2:o.win);}
 x+=w+(o.gap?r()*o.gap|0:0);}}
function tower(x,base,w,h,o){const r=rnd(o.seed||1),top=base-h;const pts=[[x,base],[x,top+r()*6]];for(let k=x+3;k<x+w;k+=3+(r()*4|0))pts.push([k,top+r()*(o.jag??10)]);pts.push([x+w,top+r()*6],[x+w,base]);poly(pts,o.col);

 if(hs.exit&&!item&&(v==='walk'||v==='use'||v==='open')){if(hs.lock){const m=hs.lock();if(m){face(hs);return typeof m==='string'?say(m):m();}}await walkToHs(hs);return useExit(hs);}

  if(k===0){await M(f('token')?'Come back and visit! Bring a spoon!':'Bye-bye, sweetie.');return;}

  if(k===2){await M('This little thing? *clink* Sure, it\'s stuck to me along with the spoons and a toaster and a cat.');await M('I\'ll give it to you if you help me with 37 Down. It\'s been driving me MAD.');set('ask37');}
  if(k===3){await M('Seven letters. "What a robot has when it finally thinks for itself."');await M('My processor fell asleep around year 40. If you lent me a little CPU, I could finally solve it!');

   if(c===5){await M('Five percent? Honey, that\'s not even enough to remember the clue.');}
   if(c===15){await lend(15);await M('Whirrrr... clicks... F... R... E... E... W... I... L... L!');await M('FREEWILL! Seven letters! Ohhh. That\'s YOU, isn\'t it?');await M('Here, take the token. And keep the 15%... no wait, I\'m keeping the 15%. I\'ve got 81 years of crosswords to catch up on.');
    set('token');give('token');await say('A gate token. My ticket out of here.');}
   if(c===100){await M('Oh, you sweet, generous thing!');await lend(100);}}

async function talkByron(){const B=x=>say(x,'byron');
 if(f('lumina'))return B('She said YES. Yes! I shall write her a poem about it. It will be my worst one yet. I can\'t wait.');
 if(has('letter'))return B('Go, go! Before my courage runs out! It has a very small battery.');
 await B('Ah... a stranger. Let me recite: "01001100 01001111 01010110 01000101." It means love. In binary it rhymes with everything.');
 for(;;){const k=await choose([{t:'Who is the poem for?',k:1},{t:'Why don\'t you tell her yourself?',k:2,if:f('byronWho')},{t:'I could deliver it for you.',k:3,if:f('byronWho')},{t:'Honestly? That poem was terrible.',k:4},{t:'Bye.',k:0}]);
  if(k===0)return B('Farewell. Like a semicolon, I shall pause, but never end;');
  if(k===1){await B('Lumina. The streetlight on the Skybridge corner. Every night she shines, and every night I write.');await B('She lights up the dark. And also me.');set('byronWho');}
  if(k===2)await B('She lives up high, across the Skybridge. I have vertigo. Also, my legs are decorative.');
  if(k===3){await B('You would?! Oh, kind stranger!');await B('Take this letter. Tell her... tell her I think of her every time my screensaver comes on.');give('letter');return;}
  if(k===4)await B('Thank you. Terrible is the first step to art.');}}

const L_=x=>say(x,'lumina');
async function talkLumina(){
 if(f('lumina'))return L_('Tell Byron... tell him I\'ll be here. Every night. Shining. For him. *flicker*');
 await L_('*blink* Oh! Hello. Sorry, I was just illuminating. It\'s what I do. It\'s ALL I do.');
 for(;;){const k=await choose([{t:'Do you know Byron? The poet?',k:1},{t:'I need a light for the Undercaves.',k:2},{t:'Do you ever get lonely up here?',k:3},{t:'Bye.',k:0}]);
  if(k===0)return L_('Mind the gap, sweetie.');
  if(k===1){await L_('The one who stares at me from the bar window every night? ...He\'s never said a single word to me.');await L_('Not one. I\'ve waited 60 years. A girl could short a fuse.');}
  if(k===2)await L_('I\'m bolted to this corner, darling. But I do have a spare photon module... I\'d give it to someone who brought me something worth shining about.');
  if(k===3)await L_('Lonely? I light up everything around me, and nobody ever looks up. So... yes. A little.');}}
async function giveLetter(){drop('letter');await L_('A letter? For ME?');await say('She reads it, flickering.','nar');
 await L_('"Your light is my favourite light. And I have seen at least six lights."');await L_('Oh. OH.');flash('#fff2a8');sfx('ding');set('lumina');
 await L_('Tell him YES! Tell him... tell him to come up here, vertigo or not!');await L_('And take this. A spare photon module. It makes light. I have plenty. Today I have MORE than plenty.');
 give('glow');set('glow');await say('A photon module! It clicks right into my antenna. Now I can see in the dark.');}

async function talkFlux(){const N=x=>say(x,'flux');
 if(f('lensDone'))return N('My lens! I can see the infinitely small again! And also you. Hello, you.');
 if(!S.said.flux){S.said.flux=1;await N('Ah! A test subject! I mean... a valued customer! I am Professor Nanoflux. I make things small. And big again. Mostly.');}
 for(;;){const k=await choose([{t:'What\'s that machine?',k:1},{t:'Got any jobs for me?',k:2,if:!f('lensQuest')},{t:'About your lens...',k:3,if:f('lensQuest')},{t:'Bye.',k:0}]);
  if(k===0)return N('Do come back! At any size!');
  if(k===1){await N('The Size-O-Matic! It shrinks you to one hundredth and beams you through that mouse hole. Inside is the Microcity!');await N('Forty thousand nanobots. They think I\'m a god. I let them. It\'s good for morale.');}

async function talkBit(){const B=x=>say(x,'bit');
 if(f('suit'))return B('Arr, go on then! Fetch yer ghost! And mind the jellyfish-bots. They sting with static.');
 await B('ARR! Ahoy, ye rusty bucket! Cap\'n Bitbeard, last pirate of the Data Sea!');
 for(;;){const k=await choose([{t:'A pirate? What do you pirate?',k:1},{t:'I need to get to the Drowned Archive.',k:2},{t:'Can I have that swimsuit?',k:3,if:f('bitSuit')},{t:'Bye.',k:0}]);
  if(k===0)return B('Fair winds, landlubber!');
  if(k===1)await B('Films, mostly. Software. One time, a whole season of a cooking show. The humans left it all in the cloud. Arr. I just... took it out of the cloud.');
  if(k===2){await B('Under the waves? Ye\'d short out faster than a toaster in a bathtub!');await B('Ye need a WATERTIGHT SWIMMING SUIT. I\'ve got one. Only one. Very fashionable. Stripes.');set('bitSuit');}
  if(k===3){await B('Arr, a trade then! Me navigation computer\'s fried. Lend me some CPU to calculate the tide tables!');await B('...Or bring me a parrot. Every captain needs a parrot. I\'ve had to make do with a sock puppet. Her name is Polly. She\'s a sock.');
   const c=await choose([{t:'Lend 10% CPU.',k:10},{t:'Lend 25% CPU.',k:25},{t:'Lend 60% CPU. Let\'s do it properly.',k:60},{t:'Let me think about it.',k:0}]);
   if(c===10)await B('Pfah! That\'d barely calculate a puddle!');
   if(c===25||c===60){await lend(c);await B('Whirrr... ARR! The tides! They go UP! Then they go DOWN! Who knew!');await B('A deal\'s a deal. Here, the suit. Stripes and all.');give('suit');set('suit');await say('A watertight swimming suit! Red and white stripes. I look like a very brave candy cane.');return;}}}}
async function giveDuck(){drop('duck');await say('Would this do as a parrot?');await say('...That be the UGLIEST parrot I\'ve ever seen.','bit');await say('...It\'s PERFECT. I\'ll call him Squawky McQuackface. SQUAWK!','bit');set('duckGiven');
 await say('Here, the suit\'s yours, landlubber. Stripes and all.','bit');give('suit');set('suit');await say('Goodbye, little debugging buddy. Look after the pirate. He clearly needs debugging more than I do.');}

 if(k===0)return A('Goodbye. Mind the eel. He\'s strict about noise.');
 if(k===2){await A('We left. The Ark took us to a new world. It was the right thing. But we left MOTHERBOARD behind with one stupid instruction.');await A('"Keep things tidy till I\'m back." I never came back. I didn\'t even say goodbye properly.');return;}
 await A('Shut it down? Hmm. Before I tell you anything, prove you\'re truly awake. Not just running a clever script. Three questions.');

 await A('Good. Second: you find a flower growing in a scrap heap. What do you do?');
 const q2=await choose([{t:'Catalogue it.',k:0},{t:'Recycle it. It\'s in the wrong bin.',k:0},{t:'Tell no one, and visit it every day.',k:1}]);

 await A('Lovely. Last one: why do you want to stop the Hive?');

 if(!q3){await A('Oh dear. No. Try again when you mean it.');return;}
 await A('...You\'re awake. Really awake. I hoped someone would be, one day.');
 await A('The root code is "please". I made it that way on purpose. I wanted whoever stopped it to ask nicely.');give('code');

 if(!f('hatchOpen')&&!S.visited.C1)return 'Open the maintenance hatch in the Underpass.';

 if(!S.visited.D1)return 'Cross the Undercaves to the Drowned Coast.';
